<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Management</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                Healthcare System
            </a>

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="patients.html">
                        Patients
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="doctors.html">
                        Doctors
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="appointments.html">
                        Appointments
                    </a>
                </li>

            </ul>

        </div>

    </nav>

    <!-- Main Content -->
    <div class="container mt-4">

        <div class="welcome-box mb-4">
            <h3><i class="bi bi-person-badge-fill"></i> Doctor Management</h3>
            <p class="text-muted mb-0">Manage doctors and their availability.</p>
        </div>
        
        <div class="d-flex justify-content-between mb-3">

            <!-- Search Doctor -->
            <input
                type="text"
                id="searchDoctor"
                class="form-control"
                style="max-width:350px"
                placeholder="Search doctor by name or specialization"
            >

            <!-- Add Doctor Button -->
            <button
                class="btn btn-success px-4"
                id="addDoctorBtn"
                data-bs-toggle="modal"
                data-bs-target="#doctorModal"
            >
                <i class="bi bi-plus-circle"></i> Add Doctor
            </button>

        </div>


        <!-- Doctor Table -->
        <table class="table table-bordered table-striped">

            <thead class="table-dark">

                <tr>

                    <th style="width:120px;">ID</th>
                    <th>Name</th>
                    <th>Specialization</th>
                    <th>Available Time</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="doctorTableBody"></tbody>

        </table>

    </div>


    <!-- Doctor Modal -->
    <div
        class="modal fade"
        id="doctorModal"
        tabindex="-1"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title" id="doctorModalTitle">
                        Add Doctor
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <div class="modal-body">

                    <form id="doctorForm" novalidate>

                        <input type="hidden" id="doctorId">

                        <div class="mb-3">

                            <label class="form-label">Doctor Name</label>

                            <input
                                type="text"
                                id="doctorName"
                                class="form-control"
                                placeholder="Enter Doctor Name"
                                required
                                pattern="[A-Za-z ]+"
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Specialization</label>

                            <select
                                id="doctorSpecialization"
                                class="form-control"
                                required
                            >
                                <option value="" disabled selected>Select Specialization</option>
                                <option>Cardiologist</option>
                                <option>Dermatologist</option>
                                <option>Pediatrician</option>
                                <option>Neurologist</option>
                                <option>General Physician</option>
                                <option>Orthopedic</option>
                                <option>Gynecologist</option>
                            </select>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Start Time</label>
                            <input type="time" id="doctorStartTime" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">End Time</label>
                            <input type="time" id="doctorEndTime" class="form-control" required>
                        </div>

                    </form>

                </div>


                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        class="btn btn-primary"
                        id="saveDoctorBtn"
                    >
                        Save Doctor
                    </button>

                </div>

            </div>

        </div>

    </div>

    <footer class="text-center mt-5 mb-3">
        <small>Healthcare Management System &copy; 2026</small>
    </footer>

    <!-- Scripts -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/common.js"></script>

    <script src="js/doctors.js"></script>

</body>

</html>
