<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic Page Setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" 
        rel="stylesheet">

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!--NAVIGATION BAR-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container-fluid">

            <!-- Project Title -->
            <a class="navbar-brand" href="index.html">
                Healthcare System
            </a>

            <!-- Navigation Links -->
            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="patients.html">
                        Patients
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="doctors.html">
                        Doctors
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="appointments.html">
                        Appointments
                    </a>
                </li>

            </ul>

        </div>

    </nav>

    <!--MAIN CONTENT-->
    <div class="container mt-4">

        <div class="welcome-box mb-4">
            <h3><i class="bi bi-people-fill"></i> Patient Management</h3>
            <p class="text-muted mb-0">Manage patient records and details.</p>
        </div>

        <!-- Search + Add Button Section -->
        <div class="d-flex justify-content-between mb-3">

            <!-- Search Patient -->
            <input
                type="text"
                id="searchPatient"
                class="form-control"
                style="max-width:350px"
                placeholder="Search patient by name or phone"
            >

            <!-- Add Patient Button -->
            <button
                class="btn btn-success px-4"
                id="addPatientBtn"
                data-bs-toggle="modal"
                data-bs-target="#patientModal"
            >
                <i class="bi bi-plus-circle"></i> Add Patient
            </button>

        </div>


        <!-- Patient Table -->
        <table class="table table-bordered table-striped">

            <!-- Table Header -->
            <thead class="table-dark">

                <tr>

                    <th style="width:120px;">ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Actions</th>

                </tr>

            </thead>


            <!-- Table Body (Dynamic Content from JavaScript) -->
            <tbody id="patientTableBody">

                <!-- Patient rows will be inserted here using JavaScript -->

            </tbody>

        </table>

    </div>
    <!-- Patient Modal -->
    <div
        class="modal fade"
        id="patientModal"
        tabindex="-1"
    >
        <div class="modal-dialog">

            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">

                    <h5 class="modal-title" id="patientModalTitle">
                        Add Patient
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <!-- Modal Body -->
                <div class="modal-body">

                    <form id="patientForm">

                        <input type="hidden" id="patientId">

                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input
                                type="text"
                                id="patientName"
                                class="form-control"
                                placeholder="Enter Patient Name"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input
                                type="number"
                                id="patientAge"
                                class="form-control"
                                placeholder="Enter Age"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Gender</label>

                            <select
                                id="patientGender"
                                class="form-control"
                                required
                            >
                                <option value="" disabled selected>Select Gender</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input
                                type="tel"
                                id="patientPhone"
                                class="form-control"
                                placeholder="Enter Phone Number"
                                pattern="[0-9]{10}"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input
                                type="email"
                                id="patientEmail"
                                class="form-control"
                                placeholder="Enter Email Address"
                            >
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Medical Notes</label>
                            <textarea
                                id="patientNotes"
                                class="form-control"
                            ></textarea>
                        </div>

                    </form>

                </div>


                <!-- Modal Footer -->
                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        id="savePatientBtn"
                    >
                        Save Patient
                    </button>

                </div>

            </div>

        </div>
    </div>

    <footer class="text-center mt-5 mb-3">
        <small>Healthcare Management System &copy; 2026</small>
    </footer>

    <!--SCRIPTS-->

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Bootstrap JS (required for modal) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Common JavaScript Functions -->
    <script src="js/common.js"></script>

    <!-- Patient JavaScript File -->
    <script src="js/patients.js"></script>

</body>

</html>
