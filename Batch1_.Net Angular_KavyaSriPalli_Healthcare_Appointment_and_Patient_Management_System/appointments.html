<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Management</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" 
        rel="stylesheet"
    >

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container-fluid">

            <a class="navbar-brand" href="index.html">
                Healthcare System
            </a>

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                    Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="patients.html">
                        Patients
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="doctors.html">
                        Doctors
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="appointments.html">
                        Appointments
                    </a>
                </li>

            </ul>

        </div>

    </nav>

    <!-- Main Content -->
    <div class="container mt-4">

        <div class="welcome-box mb-4">
            <h3><i class="bi bi-calendar-check-fill"></i> Appointment Management</h3>
            <p class="text-muted mb-0">Schedule and manage appointments.</p>
        </div>

        <!-- Search and Filter -->
        <div class="row mb-3 align-items-center">

            <div class="col-md-5">
                <input
                    type="text"
                    id="searchAppointment"
                    class="form-control"
                    placeholder="Search by Patient, Doctor or Date"
                >
            </div>

            <div class="col-md-3">
                <select id="filterStatus" class="form-control">
                    <option value="">All Status</option>
                    <option value="Booked">Booked</option>
                    <option value="Completed">Completed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>

            <div class="col-md-4 text-end">
                <button
                    class="btn btn-success px-4"
                    id="addAppointmentBtn"
                    data-bs-toggle="modal"
                    data-bs-target="#appointmentModal"
                >
                    <i class="bi bi-plus-circle"></i> Book Appointment
                </button>
            </div>

        </div>

        <!-- Appointment Table -->
        <table class="table table-bordered table-striped">

            <thead class="table-dark">

                <tr>

                    <th style="width:170px;">Appointment ID</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="appointmentTableBody"></tbody>

        </table>

    </div>


    <!-- Appointment Modal -->
    <div
        class="modal fade"
        id="appointmentModal"
        tabindex="-1"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title" id="appointmentModalTitle">
                        Book Appointment
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>


                <div class="modal-body">

                    <form id="appointmentForm" novalidate>

                        <input type="hidden" id="appointmentId">

                        <div class="mb-3">

                            <label class="form-label">Patient</label>

                            <select
                                id="appointmentPatient"
                                class="form-control" required
                            ></select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Doctor</label>

                            <select
                                id="appointmentDoctor"
                                class="form-control" required
                            ></select>

                        </div>

                        <!-- Doctor Schedule -->
                        <div id="doctorSchedule" class="mb-3"></div>

                        <div class="mb-3">

                            <label class="form-label">Date</label>

                            <input
                                type="date"
                                id="appointmentDate"
                                class="form-control" required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Time Slot</label>

                            <select id="appointmentTime" class="form-control" required>
                                <option value="" disabled selected>Select Time</option>
                            </select>
                        </div>

                        <div class="mb-3">

                            <label class="form-label">Status</label>

                            <select
                                id="appointmentStatus"
                                class="form-control"
                            >
                                <option>Booked</option>
                                <option>Completed</option>
                                <option>Cancelled</option>
                            </select>

                        </div>

                    </form>

                </div>


                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        class="btn btn-primary"
                        id="saveAppointmentBtn"
                        type="submit"
                        form="appointmentForm"
                    >
                        Save Appointment
                    </button>

                </div>

            </div>

        </div>

    </div>

    <footer class="text-center mt-5 mb-3">
        <small>Healthcare Management System &copy; 2026</small>
    </footer>

    <!-- Scripts -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/common.js"></script>

    <script src="js/appointments.js"></script>

</body>

</html>
